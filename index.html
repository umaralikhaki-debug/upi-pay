<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KreditApple</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f6f6f6}
.topbar{background:#ff5a1f;color:#fff;padding:15px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{margin:0;font-size:22px;flex:1;text-align:center}
.topbar span{font-size:22px;cursor:pointer}
.wrap{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:30px}
.pending{background:#ff5a1f;color:#fff;margin:15px;border-radius:10px 10px 0 0;padding:15px 18px;font-size:16px;font-weight:bold}
.amountBox{display:flex;border:1px solid #eee;margin:0 15px;border-radius:0 0 10px 10px;overflow:hidden}
.amountBox div{flex:1;text-align:center;padding:18px 5px}
.amountBox div:first-child{border-right:1px solid #eee}
.amountBox small{color:#888;font-size:13px}
.amountBox h2{margin:8px 0 0;font-size:28px}
.channel{padding:20px 15px 0}
.channel h3{margin:0 0 12px;font-size:18px}
.chBtn{border:1px solid #f0a080;color:#e86a2a;background:#fff;padding:9px 16px;border-radius:6px;margin:0 8px 10px 0;cursor:pointer;font-size:15px}
.chBtn.active{background:#ff5a1f;color:#fff;border-color:#ff5a1f;font-weight:bold}
.btnRow{display:flex;gap:12px;padding:18px 15px 0}
.btnRow button{flex:1;padding:13px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.repayBtn{background:#ff5a1f;color:#fff;border:none}
.extBtn{background:#fff;color:#e86a2a;border:1px solid #f0a080}
.voucher{text-align:right;padding:15px;color:#2a6cff;font-size:14px;cursor:pointer}
.warn{margin:0 15px;border:1px solid #ffb3a0;border-radius:12px;padding:14px;color:#666;font-size:14px;line-height:1.5;position:relative}
.warn b{position:absolute;top:-12px;left:12px;background:#ff3b30;color:#fff;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:16px}
.unlock{text-align:center;font-size:13px;padding:20px 0;color:#333}
.auto{text-align:center;color:#e86a2a;padding:10px;font-size:16px}
.card{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.1)}
